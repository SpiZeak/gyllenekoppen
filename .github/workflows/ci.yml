name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Compile Pages Functions
        run: bunx wrangler pages functions build --outdir=functions-check

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1

      - name: Build CSS
        run: bun run build:css

      - name: Build site
        run: zola build

  preview:
    # Per-PR Cloudflare Pages preview. Requires the CLOUDFLARE_API_TOKEN
    # and CLOUDFLARE_ACCOUNT_ID repository secrets; skipped otherwise.
    if: github.event_name == 'pull_request' && secrets.CLOUDFLARE_API_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1

      - name: Build CSS
        run: bun run build:css

      - name: Build site
        run: zola build

      - name: Deploy preview
        run: |
          bunx wrangler pages deploy public \
            --project-name=gyllenekoppen \
            --branch="${{ github.head_ref }}" \
            --commit-hash="${{ github.sha }}" \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
