# The URL the site will be built for
base_url = "https://gyllenekoppen.se"

# Site title — available in templates as {{ config.title }}
title = "Gyllene Koppen"

# Site description — available in templates as {{ config.description }}
description = "Din guide till kaffevärlden – från espresso till pour-over. Lär dig om bönor, bryggmetoder och konsten att brygga den perfekta koppen."

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

[[taxonomies]]
name = "tags"
url = "taggar"
feed = true

[markdown]

[markdown.highlighting]
theme = "catppuccin-mocha"

[extra]
# Put all your custom variables here
