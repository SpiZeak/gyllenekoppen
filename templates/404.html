<!DOCTYPE html>
<html lang="sv">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Sidan hittades inte | Gyllene Koppen</title>
	<link rel="icon"
		href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x2615;</text></svg>" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700;800;900&display=swap" />
	<link rel="stylesheet" href="/tailwind.css" />
	<style>
		body { background-color: #fefdf9; }
		html.dark body { background-color: #0d0a07; }
	</style>
	<script>
		const saved = localStorage.getItem('theme');
		if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
			document.documentElement.classList.add('dark');
		}
	</script>
</head>

<body class="flex items-center justify-center min-h-screen bg-parchment dark:bg-espresso-950 text-espresso-800 dark:text-parchment-200 p-6">
	<main class="text-center max-w-lg">
		<!-- Empty cup animation -->
		<div class="text-7xl sm:text-8xl mb-8 animate-float">&#9749;</div>

		<!-- Steam wisps -->
		<div class="relative mb-6 flex justify-center">
			<div class="relative h-10">
				<span class="steam-wisp"></span>
				<span class="steam-wisp"></span>
				<span class="steam-wisp"></span>
			</div>
		</div>

		<div class="font-serif font-black text-8xl sm:text-9xl text-gold-500/80 mb-4">404</div>
		<h1 class="font-serif font-bold text-3xl sm:text-4xl text-espresso-800 dark:text-parchment-100 mb-6 leading-tight">
			Hoppsan! Den här koppen verkar vara tom.
		</h1>
		<p class="text-parchment-500 dark:text-parchment-400 text-base sm:text-lg mb-10 leading-relaxed">
			Sidan du letar efter har förmodligen flyttats, tagits bort eller aldrig funnits.
			Låt oss brygga en ny kopp istället.
		</p>
		<div class="flex flex-wrap justify-center gap-4">
			<a href="/"
				class="bg-gold-500 hover:bg-gold-600 shadow-xl shadow-gold-500/20 px-8 py-4 rounded-full font-semibold text-white transition-all hover:shadow-gold-500/30 hover:-translate-y-0.5 tracking-wide">
				Gå hem
			</a>
			<a href="/kaffe"
				class="px-8 py-4 border-2 border-parchment-300 dark:border-espresso-500 rounded-full font-semibold text-espresso-700 dark:text-parchment-300 hover:border-gold-400 dark:hover:border-gold-600 hover:text-gold-600 dark:hover:text-gold-400 transition-all tracking-wide">
				Utforska kaffe
			</a>
		</div>
	</main>
</body>

</html>
