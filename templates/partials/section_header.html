<div class="flex flex-col sm:flex-row sm:justify-between sm:items-end gap-4 mb-12">
	<div class="max-w-xl">
		<p
			class="mb-3 font-semibold text-gold-600 dark:text-gold-400 text-xs tracking-[0.25em] uppercase animate-fade-in">
			{{ label }}</p>
		<h2
			class="font-serif font-bold text-4xl sm:text-5xl lg:text-6xl text-espresso-800 dark:text-parchment-100 leading-[1.05] animate-slide-up">
			{{ title }}</h2>
		{% if description %}
		<p class="mt-4 text-parchment-500 dark:text-parchment-400 text-lg max-w-lg animate-slide-up delay-100">
			{{ description }}
		</p>
		{% endif %}
	</div>
	{% if link_url %}
	<a href="{{ link_url }}"
		class="inline-flex items-center gap-2 font-medium text-gold-600 dark:text-gold-400 text-sm hover:text-gold-700 dark:hover:text-gold-300 transition-colors group animate-fade-in delay-200">
		{{ link_text }}
		<svg xmlns="http://www.w3.org/2000/svg" class="size-4 transition-transform group-hover:translate-x-1"
			fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
			<path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
		</svg>
	</a>
	{% endif %}
</div>
