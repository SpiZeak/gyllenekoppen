<a href="{{ permalink }}"
	class="group flex flex-col glass-card rounded-2xl overflow-hidden border border-parchment-200/50 dark:border-espresso-600/30 hover:border-gold-300/60 dark:hover:border-gold-600/30 hover:shadow-2xl hover:shadow-gold-500/5 transition-all duration-500 animate-fade-in-up"
	style="animation-delay: {{ delay }}ms">
	<div class="relative h-56 overflow-hidden shrink-0">
		{% if image %}
		<img
			src="https://images.unsplash.com/{{ image }}?w=800&h=500&fit=crop&q=80&auto=format"
			alt="{{ title }}"
			class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700"
			loading="lazy" />
		{% else %}
		<div class="w-full h-full bg-gradient-to-br from-espresso-400 to-espresso-600"></div>
		{% endif %}
		<div class="absolute inset-0 bg-gradient-to-t from-black/55 via-transparent to-transparent"></div>
	</div>

	<div class="flex flex-col flex-1 p-5 sm:p-6">
		<h3
			class="font-serif font-bold text-xl sm:text-2xl text-espresso-800 dark:text-parchment-100 group-hover:text-gold-600 dark:group-hover:text-gold-400 transition-colors leading-tight">
			{{ title }}
		</h3>
		{% if description %}
		<p class="flex-1 mt-2 text-parchment-500 dark:text-parchment-400 text-sm leading-relaxed line-clamp-2">
			{{ description }}
		</p>
		{% endif %}

		<div class="flex flex-wrap gap-2 mt-4 pt-4 border-parchment-100 dark:border-espresso-600/40 border-t">
			{% if svarighet %}
			<span
				class="inline-flex items-center gap-1.5 bg-gold-50 dark:bg-gold-900/15 px-3 py-1 rounded-full text-gold-700 dark:text-gold-300 text-xs font-medium">
				&#9889; {{ svarighet }}
			</span>
			{% endif %}
			{% if bryggtid %}
			<span
				class="inline-flex items-center gap-1.5 bg-parchment-100 dark:bg-espresso-600/40 px-3 py-1 rounded-full text-parchment-600 dark:text-parchment-300 text-xs font-medium">
				&#8987; {{ bryggtid }}
			</span>
			{% endif %}
		</div>
	</div>
</a>
